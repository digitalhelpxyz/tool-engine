<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Background remover check</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:14px;max-width:640px;margin:auto;color:#172235;line-height:1.5}h1{font-size:20px}button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:0;background:#176b59;color:#fff;margin:6px 6px 6px 0}pre{white-space:pre-wrap;word-break:break-word;background:#f2f6fa;border-radius:10px;padding:12px;font-size:13px;min-height:80px}.s{background:#e7f5ef;border:1px solid #8fcdb6;border-radius:10px;padding:10px;font-weight:700;display:none}</style></head><body>
<h1>Background remover check</h1><p>Tap the button and wait until it says DONE (up to 2 minutes). Use mobile data or Wi-Fi, whichever you use on the website. Then send a screenshot of this whole page.</p>
<button id="go">Run check</button><button id="cp" style="background:#3f4f66;display:none">Copy results</button><div class="s" id="v"></div><pre id="out">Not started.</pre>
<script>
var out=document.getElementById('out'),res={};function log(t){out.textContent+=t+'\n'}
function lim(p,ms){return Promise.race([p,new Promise(function(_,no){setTimeout(function(){no(new Error('timeout after '+ms/1000+' s'))},ms)})])}
async function step(k,name,fn,ms){var t=performance.now();try{var r=await lim(fn(),ms||60000);res[k]=1;log('OK    '+name+' ('+Math.round(performance.now()-t)+' ms)'+(r?'  '+r:''));return true}catch(e){res[k]=0;log('FAIL  '+name+'  ->  '+(e&&e.message||e));return false}}
async function getJson(u){var r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);var j=await r.json();return 'files in list: '+Object.keys(j).length}
document.getElementById('go').onclick=async function(){this.disabled=true;out.textContent='';res={};document.getElementById('v').style.display='none';
log('Phone: '+navigator.userAgent.replace(/\s+/g,' ').slice(0,110));
log('CPU cores: '+(navigator.hardwareConcurrency||'?')+' | memory GB: '+(navigator.deviceMemory||'?')+' | online: '+navigator.onLine+' | WebAssembly: '+(typeof WebAssembly)+' | SharedArrayBuffer: '+(typeof SharedArrayBuffer));log('');
await step('stat','Model list from staticimgly.com',function(){return getJson('https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/resources.json')});
await step('jsd','Model list from jsDelivr',function(){return getJson('https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.7.0/dist/resources.json')});
var f=null;
await step('m1','Library from jsDelivr',async function(){var m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');f=f||m.default||m.removeBackground;return typeof(m.default||m.removeBackground)});
await step('m2','Library from esm.sh',async function(){var m=await import('https://esm.sh/@imgly/background-removal@1.7.0');f=f||m.default||m.removeBackground;return typeof(m.default||m.removeBackground)});
if(f){var c=document.createElement('canvas');c.width=c.height=400;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,400,400);x.fillStyle='#8a5a3c';x.beginPath();x.arc(200,150,70,0,7);x.fill();x.fillStyle='#2f5aa8';x.fillRect(110,230,180,170);
var b=await new Promise(function(ok){c.toBlob(ok,'image/png')});
await step('run1','Remove background (default model server)',async function(){var o=await f(b,{model:'isnet_fp16',output:{format:'image/png',quality:1,type:'foreground'}});return 'result '+Math.round(o.size/1024)+' KB'},120000);
if(!res.run1)await step('run2','Remove background (model from jsDelivr)',async function(){var o=await f(b,{model:'isnet_fp16',publicPath:'https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.7.0/dist/',output:{format:'image/png',quality:1,type:'foreground'}});return 'result '+Math.round(o.size/1024)+' KB'},120000)}
else{log('SKIP  Remove background test (library did not load)')}
var v='';if(res.run1)v='GOOD: the background remover works on this phone and network.';else if(res.run2)v='MODEL SERVER PROBLEM: only the jsDelivr model works. Tell the developer.';else if(!res.m1&&!res.m2)v='LIBRARY PROBLEM: the AI library could not be loaded from either server.';else if(!res.stat&&!res.jsd)v='MODEL PROBLEM: the AI model files could not be downloaded from either server.';else v='ENGINE PROBLEM: files loaded but the AI could not run. Tell the developer.';
log('');log('DONE');var e=document.getElementById('v');e.textContent=v;e.style.display='block';document.getElementById('go').disabled=false;var cp=document.getElementById('cp');cp.style.display='inline-block';cp.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(v+'\n'+out.textContent)}};
</script></body></html>
